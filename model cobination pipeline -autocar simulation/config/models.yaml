# Model configurations for SIH 2026 Perception Pipeline
# Paths point to the Best Model directory

road_model:
  backend: "onnx"
  path: "../Best Model/Road-segmentation-UNET-model-main/models/onnx_models/road_seg_160_160.onnx"
  input_size: [160, 160]
  device: "cpu"
  threshold: 0.35
  multiscale: true

traffic_model:
  backend: "ultralytics"
  path: "../Best Model/YOLOv8.3.0 Train on IDD/runs/idd_yolov8_training/weights/best.pt"
  fallback_path: "../Best Model/YOLOv8.3.0 Train on IDD/yolov8m.pt"
  input_size: [640, 640]
  confidence: 0.35
  iou: 0.70
  device: "cpu"
  classes_yaml: "../Best Model/YOLOv8.3.0 Train on IDD/idd_fixed.yaml"

pothole_model:
  backend: "yolo"
  path: "../Best Model/Potholes-Detection-YOLOv11/Potholes-Detection-YOLOv11/runs/detect/train/weights/best.pt"
  confidence: 0.30     # Only detections with YOLO score >= 30% are kept
  iou: 0.45            # NMS IoU threshold
  max_detections: 20   # Maximum potholes per frame
  device: "cpu"

